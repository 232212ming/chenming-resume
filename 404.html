<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>页面不存在 · 陈明</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { /* 忽略 */ }
    })();
  </script>
  <style>
    .notfound {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    .notfound-inner { max-width: 32rem; }
    .notfound-code {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.22em;
      color: var(--accent);
      margin-bottom: 1.2rem;
    }
    .notfound h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      letter-spacing: -0.04em;
      line-height: 1.2;
    }
    .notfound p { margin-top: 1rem; color: var(--muted); line-height: 1.9; }
    .notfound-actions { margin-top: 2rem; display: flex; flex-wrap: wrap; gap: 0.7rem; }
  </style>
</head>
<body>
  <main class="notfound">
    <div class="notfound-inner">
      <p class="notfound-code">404 / NOT FOUND</p>
      <h1>这一页走丢了。</h1>
      <p>你要找的地址不存在，可能是链接写错了，或者内容已经被移动。</p>
      <div class="notfound-actions">
        <a class="btn btn-primary" href="./">回到首页</a>
        <a class="btn btn-ghost" href="mailto:3027024265@qq.com">写封信告诉我</a>
      </div>
    </div>
  </main>
</body>
</html>
