<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 625" width="500" height="625" role="img" aria-label="陈明的头像">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8efe6"/>
      <stop offset="0.55" stop-color="#efdfd1"/>
      <stop offset="1" stop-color="#e4cdbc"/>
    </linearGradient>
    <radialGradient id="warm" cx="78%" cy="18%" r="58%">
      <stop offset="0" stop-color="#c05a38" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#c05a38" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="16%" cy="88%" r="55%">
      <stop offset="0" stop-color="#39434b" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#39434b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#7a5a44" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="500" height="625" fill="url(#paper)"/>
  <rect width="500" height="625" fill="url(#grid)"/>
  <circle cx="400" cy="120" r="190" fill="url(#warm)"/>
  <circle cx="90" cy="560" r="180" fill="url(#cool)"/>

  <circle cx="250" cy="310" r="168" fill="none" stroke="#8a6a52" stroke-opacity="0.3"/>
  <circle cx="250" cy="310" r="196" fill="none" stroke="#8a6a52" stroke-opacity="0.16" stroke-dasharray="2 9"/>
  <rect x="20" y="20" width="460" height="585" fill="none" stroke="#7a5a44" stroke-opacity="0.22"/>

  <text x="48" y="58" font-family="'Cascadia Mono','SFMono-Regular',Consolas,monospace" font-size="12" letter-spacing="3.2" fill="#6d5443">PROFILE</text>
  <text x="452" y="58" text-anchor="end" font-family="'Cascadia Mono','SFMono-Regular',Consolas,monospace" font-size="12" letter-spacing="2.2" fill="#6d5443">2027</text>

  <text x="250" y="398" text-anchor="middle" font-family="'Songti SC','STSong','SimSun',Georgia,serif" font-size="248" fill="#b4482a">陈</text>

  <line x1="48" y1="556" x2="452" y2="556" stroke="#7a5a44" stroke-opacity="0.24"/>
  <text x="48" y="586" font-family="Georgia,'Songti SC',serif" font-size="22" letter-spacing="0.8" fill="#3d3027">Chen Ming</text>
  <text x="452" y="586" text-anchor="end" font-family="'Cascadia Mono','SFMono-Regular',Consolas,monospace" font-size="9" letter-spacing="1.4" fill="#6d5443">AIRCRAFT MAINTENANCE</text>
</svg>